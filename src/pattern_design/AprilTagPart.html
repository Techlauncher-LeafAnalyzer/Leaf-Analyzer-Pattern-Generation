<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AprilTag part</title>
    <style>
      :root {
        --area-size: 300px;
        --tag-size: 48px;
      }

      .area {
        position: relative;
        width: var(--area-size);
        height: var(--area-size);
      }

      .tag {
        position: absolute;
        width: var(--tag-size);
        height: var(--tag-size);
        background: black;
        z-index: 2;
      }

      .top-left {
        top: 0;
        left: 0;
      }
      .top-right {
        top: 0;
        right: 0;
      }
      .bottom-left {
        bottom: 0;
        left: 0;
      }
      .bottom-right {
        bottom: 0;
        right: 0;
      }

      .line {
        position: absolute;
        z-index: 1;
        box-sizing: border-box;
      }

      .top-line {
        top: 0;
        left: calc(var(--tag-size) + (100% - 2 * var(--tag-size)) * 0.05);
        width: calc((100% - 2 * var(--tag-size)) * 0.9);
        border-top: 1px dashed rgb(52, 52, 52);
      }

      .bottom-line {
        bottom: 0;
        left: calc(var(--tag-size) + (100% - 2 * var(--tag-size)) * 0.05);
        width: calc((100% - 2 * var(--tag-size)) * 0.9);
        border-top: 1px dashed rgb(52, 52, 52);
      }

      .left-line {
        left: 0;
        top: calc(var(--tag-size) + (100% - 2 * var(--tag-size)) * 0.05);
        height: calc((100% - 2 * var(--tag-size)) * 0.9);
        border-left: 1px dashed rgb(52, 52, 52);
      }

      .right-line {
        right: 0;
        top: calc(var(--tag-size) + (100% - 2 * var(--tag-size)) * 0.05);
        height: calc((100% - 2 * var(--tag-size)) * 0.9);
        border-left: 1px dashed rgb(52, 52, 52);
      }
    </style>
  </head>
  <body>
    <div class="area">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="10 10 80 80"
        class="tag top-left"
      >
        <path
          style="fill: #ffffff; stroke: none"
          d="M0 0L0 100L100 100L100 0L0 0z"
        ></path>
        <path
          style="fill: #000000; stroke: none"
          d="M10 10L10 90L90 90L90 10L10 10z"
        ></path>
        <path
          style="fill: #ffffff; stroke: none"
          d="M20 20L20 30L30 30L30 50L20 50L20 60L30 60L30 70L40 70L40 60L50 60L50 80L60 80L60 70L70 70L70 60L50 60L50 40L60 40L60 20L50 20L50 30L40 30L40 20L20 20M70 20L70 40L80 40L80 20L70 20z"
        ></path>
        <path
          style="fill: #000000; stroke: none"
          d="M30 50L30 60L40 60L40 50L30 50z"
        ></path>
      </svg>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100mm"
        height="100mm"
        viewBox="10 10 80 80"
        class="tag top-right"
      >
        <path
          style="fill: #ffffff; stroke: none"
          d="M0 0L0 100L100 100L100 0L0 0z"
        ></path>
        <path
          style="fill: #000000; stroke: none"
          d="M10 10L10 90L90 90L90 10L10 10z"
        ></path>
        <path
          style="fill: #ffffff; stroke: none"
          d="M20 20L20 30L30 30L30 40L20 40L20 50L30 50L30 60L20 60L20 70L30 70L30 60L40 60L40 80L50 80L50 70L60 70L60 60L50 60L50 50L60 50L60 40L80 40L80 30L70 30L70 20L50 20L50 40L40 40L40 20L20 20M70 60L70 80L80 80L80 60L70 60z"
        ></path>
      </svg>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100mm"
        height="100mm"
        viewBox="10 10 80 80"
        class="tag bottom-left"
      >
        <path
          style="fill: #ffffff; stroke: none"
          d="M0 0L0 100L100 100L100 0L0 0z"
        ></path>
        <path
          style="fill: #000000; stroke: none"
          d="M10 10L10 90L90 90L90 10L10 10z"
        ></path>
        <path
          style="fill: #ffffff; stroke: none"
          d="M20 20L20 30L30 30L30 40L20 40L20 50L30 50L30 40L40 40L40 20L20 20M50 20L50 30L60 30L60 40L70 40L70 30L80 30L80 20L50 20M40 50L40 60L50 60L50 70L40 70L40 80L70 80L70 70L60 70L60 60L50 60L50 50L40 50M70 50L70 60L80 60L80 50L70 50z"
        ></path>
      </svg>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100mm"
        height="100mm"
        viewBox="10 10 80 80"
        class="tag bottom-right"
      >
        <path
          style="fill: #ffffff; stroke: none"
          d="M0 0L0 100L100 100L100 0L0 0z"
        ></path>
        <path
          style="fill: #000000; stroke: none"
          d="M10 10L10 90L90 90L90 10L10 10z"
        ></path>
        <path
          style="fill: #ffffff; stroke: none"
          d="M20 20L20 30L50 30L50 50L40 50L40 60L30 60L30 40L20 40L20 70L30 70L30 80L50 80L50 70L40 70L40 60L50 60L50 50L70 50L70 60L60 60L60 70L70 70L70 60L80 60L80 20L70 20L70 30L50 30L50 20L20 20z"
        ></path>
      </svg>

      <div class="line top-line"></div>
      <div class="line bottom-line"></div>
      <div class="line left-line"></div>
      <div class="line right-line"></div>
    </div>
  </body>
</html>
