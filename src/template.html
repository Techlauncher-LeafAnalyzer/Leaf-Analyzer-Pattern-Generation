<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AprilTag Layout</title>
    <link rel="stylesheet" href="../css/template.css" />
  </head>
  <body>
    <div class="page" id="page">
      <div class="text-area">
        <div class="header-content">
          <div class="title-block">
            <div class="title-main">Leaf Analyzer</div>
            <div class="title-sub">APPN-Tech</div>
          </div>
          <img
            class="logo"
            src="https://via.placeholder.com/240x240.png?text=Logo"
            alt="Logo"
          />
          <img
            class="qr"
            src="https://via.placeholder.com/240x240.png?text=QR"
            alt="QR Code"
          />
        </div>
      </div>

      <div class="pattern">
        <div class="tag tl">
          <span class="on"></span><span class="on"></span><span></span
          ><span class="on"></span><span></span> <span class="on"></span
          ><span></span><span></span><span></span><span class="on"></span>
          <span></span><span class="on"></span><span class="on"></span
          ><span></span><span></span> <span class="on"></span><span></span
          ><span></span><span class="on"></span><span></span> <span></span
          ><span class="on"></span><span class="on"></span><span></span
          ><span class="on"></span>
        </div>

        <div class="tag tr">
          <span></span><span class="on"></span><span class="on"></span
          ><span></span><span class="on"></span> <span class="on"></span
          ><span></span><span></span><span class="on"></span><span></span>
          <span></span><span class="on"></span><span></span
          ><span class="on"></span><span class="on"></span>
          <span class="on"></span><span></span><span class="on"></span
          ><span></span><span></span> <span></span><span class="on"></span
          ><span></span><span class="on"></span><span class="on"></span>
        </div>

        <div class="tag bl">
          <span class="on"></span><span></span><span class="on"></span
          ><span class="on"></span><span></span> <span></span
          ><span class="on"></span><span></span><span></span
          ><span class="on"></span> <span class="on"></span><span></span
          ><span class="on"></span><span class="on"></span><span></span>
          <span></span><span class="on"></span><span></span><span></span
          ><span class="on"></span> <span class="on"></span><span></span
          ><span class="on"></span><span class="on"></span><span></span>
        </div>

        <div class="tag br">
          <span></span><span class="on"></span><span></span
          ><span class="on"></span><span class="on"></span>
          <span class="on"></span><span></span><span class="on"></span
          ><span></span><span></span> <span></span><span class="on"></span
          ><span></span><span></span><span class="on"></span>
          <span class="on"></span><span></span><span class="on"></span
          ><span class="on"></span><span></span> <span></span
          ><span class="on"></span><span></span><span></span
          ><span class="on"></span>
        </div>
      </div>

      <!-- <div class="info" id="info"></div> -->
    </div>
    <script src="../js/template.js"></script>
  </body>
</html>
