<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <link rel="stylesheet" href="./css/lggc.min.css" />
    <link rel="stylesheet" href="./css/index.css" />
    
  </head>
  <body>
    <div class="window lggc">
      <!-- Header -->
      <div class="titlebar lggc">
        <h1>Pattern Designer</h1>
      </div>
      <!-- Body -->
      <div class="content">
        <!-- Left Input Area -->
        <section class="left">
          <div class="group lggc" style="--lggc-blur: 10px">
            <div class="fields">
              <!-- Paper Size -->
              <label class="field">
                <span class="label">Paper size</span>
                <span class="select-wrap">
                  <select class="select" id="paperSize">
                    <option value="A0">A0 (841 x 1189 mm)</option>
                    <option value="A1">A1 (594 x 841 mm)</option>
                    <option value="A2">A2 (420 x 594 mm)</option>
                    <option value="A3">A3 (297 x 420 mm)</option>
                    <option value="A4">A4 (210 x 297 mm)</option>
                    <option value="B4">B4 (250 x 353 mm)</option>
                    <option value="B5">B5 (176 x 250 mm)</option>
                    <option value="Custom">Custom</option>
                  </select>
                </span>
                <span></span>
              </label>
              <span class="error-msg"></span>
              <!-- Paper Width -->
              <label class="field">
                <span class="label" id="paperWidthNm">Paper width</span>
                <input class="lggc" id="paperWidth" type="number" value="210" />
              </label>
              <span class="error-msg" id="paperWidthErr"></span>

              <!-- Paper Height -->
              <label class="field">
                <span class="label" id="paperHeightNm">Paper height</span>
                <input
                  class="lggc"
                  id="paperHeight"
                  type="number"
                  value="297"
                />
              </label>
              <span class="error-msg" id="paperHeightErr"></span>

              <!-- Paper Orientation -->
              <label class="field">
                <span class="label">Orientation</span>
                <span class="select-wrap">
                  <select class="select" id="orientation">
                    <option value="Portrait" selected>Portrait</option>
                    <option value="Landscape">Landscape</option>
                  </select>
                </span>
              </label>
            </div>
          </div>
          <!-- Pattern -->
          <div class="group lggc" style="--lggc-blur: 10px">
            <div class="fields">
              <label class="field two-col">
                <span class="label" id="patternWidthNm">Pattern width</span>
                <input
                  id="patternWidth"
                  class="lggc"
                  style="--lggc-bg: rgba(255, 255, 255, 0.28)"
                  type="number"
                  value="200"
                />
              </label>
              <span class="error-msg" id="patternWidthErr"></span>
              <label class="field two-col">
                <span class="label" id="patternHeightNm">Pattern height</span>
                <input
                  id="patternHeight"
                  class="lggc"
                  style="--lggc-bg: rgba(255, 255, 255, 0.48)"
                  type="number"
                  value="244"
                />
              </label>
              <span class="error-msg" id="patternHeightErr"></span>
              <label class="field two-col">
                <span class="label" id="aprilTagLengthNm">AprilTag length</span>
                <input
                  id="aprilTagLength"
                  class="lggc"
                  style="--lggc-bg: rgba(255, 255, 255, 0.28)"
                  type="number"
                  value="15"
                />
              </label>
              <span class="error-msg" id="aprilTagLengthErr"></span>
              <label class="field two-col">
                <span class="label" id="textHeightNm">Text area height</span>
                <input
                  id="textHeight"
                  class="lggc"
                  style="--lggc-bg: rgba(255, 255, 255, 0.28)"
                  type="number"
                  value="28"
                />
              </label>
              <span class="error-msg" id="textHeightErr"></span>
            </div>
          </div>
          <!-- Margins -->
          <div
            style="
              display: grid;
              grid-template-columns: auto 1fr;
              gap: 12px;
              align-items: center;
            "
          >
            <div class="label lggc" style="font-size: 16px; font-weight: 600">
              Margins
            </div>
            <div class="group disabled margins-box">
              <div id="marginsText">
                Left: 5 mm, Right: 5 mm<br />
                Top: 5 mm, Bottom: 5 mm
              </div>
            </div>
          </div>
        </section>
        <!-- Preview Area -->
        <section class="preview-wrap">
          <div class="paper">
            <div class="preview-viewport">
              <div class="preview-stage">
                <iframe
                  src="./src/template.html"
                  class="preview-iframe"
                  frameborder="0"
                ></iframe>
              </div>
            </div>
          </div>
          <div class="preview-label lggc">Preview</div>
        </section>
      </div>
      <!-- Two Buttons Area -->
      <div class="actions">
        <button class="btn cancel lggc" id="resetBtn" type="button">
          <span class="icon">✖</span><span>Reset</span>
        </button>
        <button class="btn ok lggc" id="okBtn" type="button">
          <span class="icon">✔</span><span>Print</span>
        </button>
      </div>
    </div>
    <script src="./js/index.js"></script>
  </body>
</html>
